[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serl_robot_infra"
version = "0.0.1"
description = "Robot infrastructure and task environments"
requires-python = ">=3.12"
dependencies = [
    "gym>=0.26",
    "gymnasium==0.29.1",
    "numpy>=1.24.3",
    "opencv-python>=4.11.0.86",
    "pynput>=1.8.2",
    "scipy==1.11.4",
    "requests",
    "flask",
    "pyyaml",
    "defusedxml",
    "pyquaternion>=0.9.9",
]
